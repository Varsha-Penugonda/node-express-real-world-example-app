name: Architecture Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  architecture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # High-level
      - uses: builditwithgk/repo-cartographer@v1
        with:
          path: .
          config: .cartographer.yml
          level: high
          format: mermaid

      # Detail
      - uses: builditwithgk/repo-cartographer@v1
        with:
          path: .
          config: .cartographer.yml
          level: detail
          format: mermaid

      # DOT
      - uses: builditwithgk/repo-cartographer@v1
        with:
          path: .
          config: .cartographer.yml
          level: detail
          format: dot

      - uses: actions/upload-artifact@v4
        with:
          name: architecture-diagrams
          path: |
            architecture.html
            architecture.mermaid
            architecture.dot
