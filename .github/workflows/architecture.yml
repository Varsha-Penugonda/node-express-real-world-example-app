name: Architecture Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  architecture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Detailed Mermaid Diagram
        uses: builditwithgk/repo-cartographer@v1
        with:
          path: .
          config: .cartographer.yml
          level: detail
          format: mermaid

      - name: Generate DOT Diagram
        uses: builditwithgk/repo-cartographer@v1
        with:
          path: .
          config: .cartographer.yml
          level: detail
          format: dot