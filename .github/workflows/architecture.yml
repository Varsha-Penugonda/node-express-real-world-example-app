name: Architecture Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  architecture:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: High Diagram
        run: npx -y repo-cartographer map . --level high -o docs/high

      - name: Detail Diagram
        run: npx -y repo-cartographer map . --level detail -o docs/detail

      - name: Check Rules
        run: npx -y repo-cartographer check . --baseline NUL

      - name: Upload Diagrams
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagrams
          path: |
            docs/high/**
            docs/detail/**
